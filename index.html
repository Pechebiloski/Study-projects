<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Caacupe+One&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Quicksand:wght@300..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Spicy+Rice&family=Unkempt:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="calculadora">
            <div class="display">
                <input type="text" class="display-input" placeholder="0">
                <input type="text" class="display-result">
            </div>
            <div class="buttons">
                <button class="operator">AC</button>
                <button class="operator">( )</button>
                <button class="operator">%</button>
                <button class="operator"><span>÷</span></button>
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="operator"><span>×</span></button>
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="operator"><span>-</span></button>
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="operator"><span>+</span></button>
                <button>0</button>
                <button>.</button>
                <button class="operator backspace"><span></span></button>
                <button class="operator"><span>=</span></button>

            </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
